# Dokploy Compose deployment.
#
# Why Compose rather than a Dokploy Application: exactly one instance may hold
# a given TEE_STATE_DIR, and the lock is never reclaimed automatically (see
# docs/OPERATIONS.md). Compose recreates a changed service stop-then-start, so
# a redeploy hands the lock over cleanly. A Swarm service's default rolling
# update starts the replacement before stopping the old one, which would meet a
# held lock and crash-loop until someone deleted the lock file by hand.
#
# Set TEE_SECRET_HMAC_KEY in Dokploy's Environment tab. Everything else is
# literal here. Dokploy's Compose Type MUST be `docker compose`, not Stack:
# Swarm ignores `build:` and restores the rolling update this design avoids.
# See docs/DEPLOY.md for first-boot preparation of /opt/tee-docker.

services:
  tee-docker:
    build:
      context: .
      dockerfile: Dockerfile
    image: tee-docker:local
    init: true
    restart: unless-stopped

    # Never raise this. Two instances against one state directory is the
    # failure the lock exists to prevent.
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: "1024M"
        reservations:
          cpus: "0.5"
          memory: "512M"

    # List form with bare names for anything secret: Compose passes the value
    # through when set and leaves the variable UNDEFINED when not. The mapping
    # form "${VAR}" would instead inject an empty string, which would override
    # a value Dokploy had already placed in the container. Everything else is a
    # literal, so this file needs no parse-time interpolation to deploy.
    environment:
      # Hard boot requirement, minimum 16 bytes. Every tenant's secretHash is
      # computed under it, so changing it invalidates all of them at once.
      # Absent, the service stops at boot with its own explicit message.
      - TEE_SECRET_HMAC_KEY

      # One real Argon2 derivation must finish inside this budget or the
      # service refuses to start. Measured at 559ms on an idle laptop, so the
      # 1000ms default leaves little room on a shared VPS core. Raised here
      # deliberately; do not disable the check.
      - TEE_KDF_MAX_PROBE_MS=2500

      - TEE_MAX_UNLOCKED_WORKSPACES=32
      - TEE_MAX_TOKEN_LEASES_PER_WORKSPACE=64
      - TEE_MINT_RATE_LIMIT=10
      - TEE_WORKSPACE_CREATE_RATE_LIMIT=10
      - TEE_WORKSPACE_RECREATE_COOLDOWN_SEC=60
      - TEE_MAX_RPC_OPERATIONS_PER_TENANT=8
      - TEE_RPC_DEADLINE_MS=15000

    # Host paths are literal on purpose. Compose resolves volume paths when it
    # PARSES this file, before any container exists, so a "${VAR}" here would
    # depend on the deploying process seeing that variable rather than the
    # container seeing it. A literal cannot fail that way.
    #
    # These directories must exist and be owned by uid 1000 before the first
    # start. Docker silently creates a missing bind-mount source as root, and
    # the service chmods its state directory to 0700 on boot, which requires
    # ownership. See docs/DEPLOY.md.
    volumes:
      - /opt/tee-docker/state:/var/lib/tee-docker/state
      - /opt/tee-docker/data:/var/lib/tee-docker/data
      # Read-only: the service only ever reads this file. Mounted as a single
      # file so errors.json stays the copy that shipped with the image. The
      # host file must exist first, or Docker creates a DIRECTORY here.
      - /opt/tee-docker/tenants.json:/app/config/tenants.json:ro

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/v1/health').then(r=>r.json()).then(j=>process.exit(j.status==='ok'?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

    # No published host port on purpose: Traefik reaches the container over
    # dokploy-network, so port 3000 is never exposed on the host interface.
    networks:
      - dokploy-network

    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.services.tee-docker.loadbalancer.server.port=3000

      - traefik.http.routers.tee-docker-web.rule=Host(`${TEE_API_HOST:-tee-api.hypetrade.xyz}`)
      - traefik.http.routers.tee-docker-web.entrypoints=web
      - traefik.http.routers.tee-docker-web.middlewares=tee-docker-https

      - traefik.http.routers.tee-docker.rule=Host(`${TEE_API_HOST:-tee-api.hypetrade.xyz}`)
      - traefik.http.routers.tee-docker.entrypoints=websecure
      - traefik.http.routers.tee-docker.tls.certresolver=letsencrypt
      - traefik.http.routers.tee-docker.service=tee-docker

      # Tenant API secrets and workspace tokens travel these requests. Plain
      # HTTP is redirected rather than served.
      - traefik.http.middlewares.tee-docker-https.redirectscheme.scheme=https
      - traefik.http.middlewares.tee-docker-https.redirectscheme.permanent=true

networks:
  dokploy-network:
    external: true
